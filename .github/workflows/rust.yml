name: Supported fork checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify paired runtime and release asset generation
        run: |
          node tools/regenerate_browser_runtime.mjs --check
          node --test tests/browser_runtime.test.mjs
          python3 tests/test_prepare_release.py
      - name: Install native graphics and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Install supported Rust targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add --toolchain stable wasm32-unknown-unknown
      - name: Format fork code and patched backend files
        run: |
          for manifest in Cargo.toml macroquad_macro/Cargo.toml physics-platformer/Cargo.toml profiler/Cargo.toml tiled/Cargo.toml tests/texture_cache/Cargo.toml; do
            cargo +stable fmt --manifest-path "$manifest" -- --check
          done
          rustfmt +stable --edition 2018 --check vendor/miniquad/src/graphics/gl.rs vendor/miniquad/src/graphics/gl/cache.rs vendor/miniquad/src/native/linux_x11/clipboard.rs vendor/miniquad/src/native/linux_x11/drag_n_drop.rs
      - name: Verify the published backend source and narrow patch
        run: python3 tools/vendor_miniquad.py
      - name: Check backend cache and property boundaries
        run: CARGO_TARGET_DIR=target/miniquad-tests cargo +stable test --manifest-path vendor/miniquad/Cargo.toml --locked --lib
      - name: Check real X11 properties and clipboard self-selection
        run: CARGO_TARGET_DIR=target/miniquad-tests xvfb-run -a cargo +stable test --manifest-path vendor/miniquad/Cargo.toml --locked --lib live_x11_ -- --ignored
      - run: cargo +stable check --all-targets --no-default-features
      - run: cargo +stable check --all-targets --features audio
      - run: cargo +stable check --all-targets --target wasm32-unknown-unknown --features audio
      - name: Link browser lifecycle fixtures
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo +stable build --example audio_lifecycle_regression --example graphics_ownership_regression --target wasm32-unknown-unknown --features audio
      - name: Reject missing runtime imports and incompatible Rust pairing
        run: |
          node tools/check_browser_runtime.mjs --source-only
          node tools/check_browser_runtime.mjs --wasm target/wasm32-unknown-unknown/debug/examples/audio_lifecycle_regression.wasm
          node tools/check_browser_runtime.mjs --wasm target/wasm32-unknown-unknown/debug/examples/graphics_ownership_regression.wasm --no-audio
      - name: Check lifecycle CPU paths and grouped graphics tests
        run: xvfb-run -a cargo +stable test --tests --no-default-features
      - run: cargo +stable test --test image_codecs --no-default-features
      - run: xvfb-run -a cargo +stable test --doc --no-default-features
      - name: Validate transfers, UI and graphics ownership on native GL
        run: |
          xvfb-run -a env CARGO_TARGET_DIR=target/texture-cache-native cargo +stable run --manifest-path tests/texture_cache/Cargo.toml
          xvfb-run -a cargo +stable run --example image_transfer_regression --no-default-features
          xvfb-run -a cargo +stable run --example graphics_ownership_regression --no-default-features
          xvfb-run -a cargo +stable test --lib ui_material_is_lazy_and_reused_after_empty_frames -- --ignored
      - name: Record resolved native and browser dependencies
        run: |
          cargo +stable tree --target x86_64-unknown-linux-gnu --no-default-features
          cargo +stable tree --target wasm32-unknown-unknown --features audio

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the supported minimum compiler
        run: rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.88.0 check --all-targets --no-default-features
      - run: cargo +1.88.0 check --all-targets --target wasm32-unknown-unknown --features audio
      - run: cargo +1.88.0 test --test image_codecs --no-default-features

  miri:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated interpreter toolchain
        run: rustup toolchain install nightly-2026-10-16 --profile minimal --component miri --component rust-src
      - name: Check ownership, lifecycle, buffers and uniform bounds
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly-2026-10-16 miri test --lib --target ${{ matrix.target }}
          -- ownership::tests texture::ownership_tests telemetry::tests
          experimental::coroutines::tests audio::tests texture::tests tobytes::tests
          quad_gl::uniform_tests text::atlas::tests
      - name: Check Xlib reply layouts and cleanup without foreign calls
        run: >-
          CARGO_TARGET_DIR=target/miniquad-miri cargo +nightly-2026-10-16 miri test
          --manifest-path vendor/miniquad/Cargo.toml --locked --lib --target ${{ matrix.target }}
          -- property_tests capability_tests xdnd_property_tests
