name: Supported fork checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native graphics and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Install supported Rust targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add --toolchain stable wasm32-unknown-unknown
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --all-targets --no-default-features
      - run: cargo +stable check --all-targets --features audio
      - run: cargo +stable check --all-targets --target wasm32-unknown-unknown --features audio
      - run: cargo +stable test --lib --no-default-features
      - run: xvfb-run -a cargo +stable test --doc --no-default-features
      - name: Validate RGBA transfers and UI shader lifecycle on native GL
        run: |
          xvfb-run -a cargo +stable run --example image_transfer_regression --no-default-features
          xvfb-run -a cargo +stable test --lib ui_material_is_lazy_and_reused_after_empty_frames -- --ignored
      - name: Record resolved native and browser dependencies
        run: |
          cargo +stable tree --target x86_64-unknown-linux-gnu --no-default-features
          cargo +stable tree --target wasm32-unknown-unknown --features audio

  miri:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated interpreter toolchain
        run: rustup toolchain install nightly-2026-10-16 --profile minimal --component miri --component rust-src
      - name: Check CPU buffers, representations and uniform bounds
        run: >-
          cargo +nightly-2026-10-16 miri test --lib --target ${{ matrix.target }}
          -- texture::tests tobytes::tests quad_gl::uniform_tests
