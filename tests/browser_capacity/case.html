<!doctype html>
<meta charset="utf-8">
<style>html,body {margin:0} canvas {width:64px;height:64px;display:block}</style>
<canvas id="glcanvas" width="64" height="64" tabindex="1"></canvas>
<script>
window.evidence = {messages:[], errors:[], expectedStartupErrors:[], phases:[], completed:false};
const oldV1 = new URLSearchParams(location.search).get("selectionVersion") === "1";
const contextRequests = [];
evidence.contextRequests = contextRequests;
evidence.resources = {createdBuffers:0,liveBuffers:0};
const getContext = HTMLCanvasElement.prototype.getContext;
HTMLCanvasElement.prototype.getContext = function(name, ...args) {
    if (name === "webgl" || name === "webgl2") {
        contextRequests.push({name, attributes: args[0] === undefined ? null : {...args[0]}});
        if (name === "webgl2" && new URLSearchParams(location.search).get("block2") === "1") return null;
    }
    return getContext.call(this,name,...args);
};
const stores = new Map(), uploads = new Map();
for (const proto of [WebGLRenderingContext.prototype, WebGL2RenderingContext.prototype]) {
    const allocate = proto.bufferData, upload = proto.bufferSubData, remove = proto.deleteBuffer;
    const create = proto.createBuffer, live = new Set();
    proto.createBuffer = function() {
        const buffer = create.call(this);
        if (buffer) { live.add(buffer); evidence.resources.createdBuffers++; evidence.resources.liveBuffers++; }
        return buffer;
    };
    proto.bufferData = function(target, data, ...args) {
        const binding = this.getParameter(target === this.ARRAY_BUFFER ? this.ARRAY_BUFFER_BINDING : this.ELEMENT_ARRAY_BUFFER_BINDING);
        stores.set(binding, typeof data === "number" ? data : data.byteLength);
        return allocate.call(this,target,data,...args);
    };
    proto.bufferSubData = function(target, offset, data, ...args) {
        const binding = this.getParameter(target === this.ARRAY_BUFFER ? this.ARRAY_BUFFER_BINDING : this.ELEMENT_ARRAY_BUFFER_BINDING);
        if (!binding || !stores.has(binding) || !Number.isSafeInteger(stores.get(binding))) evidence.errors.push("Upload allocation is unknown");
        if (offset !== 0 || !Number.isSafeInteger(data.byteLength) || data.byteLength > stores.get(binding)) evidence.errors.push("Upload exceeds allocated buffer");
        uploads.set(binding,new Uint8Array(data.buffer,data.byteOffset,data.byteLength).slice());
        return upload.call(this,target,offset,data,...args);
    };
    proto.deleteBuffer = function(buffer) {
        if (buffer) {
            if (!live.delete(buffer)) evidence.errors.push("Duplicate/unowned buffer deletion");
            else evidence.resources.liveBuffers--;
        }
        stores.delete(buffer); uploads.delete(buffer);
        return remove.call(this,buffer);
    };
}
let active, restore;
function begin(name) {
    if (active) throw new Error("Nested capacity phase");
    evidence.context = {version:gl.getParameter(gl.VERSION), renderer:gl.getParameter(gl.RENDERER),
        requests:contextRequests, attributes:gl.getContextAttributes(), samples:gl.getParameter(gl.SAMPLES),
        sampleBuffers:gl.getParameter(gl.SAMPLE_BUFFERS)};
    active = {name, draws:[]};
    const originals = new Map();
    for (const method of ["drawElements", "drawElementsInstanced"]) {
        const original = gl[method];
        if (typeof original !== "function") continue;
        originals.set(method, original);
        gl[method] = function(mode,count,type,offset,instances=1) {
            const vertices = uploads.get(gl.getParameter(gl.ARRAY_BUFFER_BINDING));
            const indices = uploads.get(gl.getParameter(gl.ELEMENT_ARRAY_BUFFER_BINDING));
            if (!vertices || !indices || type !== gl.UNSIGNED_SHORT || offset !== 0 || instances !== 1 || count * 2 !== indices.byteLength) throw new Error("Unexpected indexed upload/draw contract");
            const values = new Uint16Array(indices.buffer,indices.byteOffset,count);
            let maxIndex = 0;
            for (const index of values) maxIndex = Math.max(maxIndex,index);
            const vertexCount = vertices.byteLength / 40;
            if (!Number.isInteger(vertexCount) || maxIndex >= vertexCount) throw new Error("Index exceeds uploaded vertex slice");
            if (active.name.startsWith("policy-arc-")) {
                const data = new DataView(vertices.buffer,vertices.byteOffset,vertices.byteLength);
                const part = Math.fround(active.arcDegrees * Math.fround(Math.PI / 180));
                const span = Math.fround(part / active.segments);
                for (const index of values) {
                    const segment = Math.floor(active.sourceIndices / 6), corner = [0,1,2,2,1,3][active.sourceIndices % 6];
                    const start = Math.fround(segment * span), angle = corner < 2 ? start : Math.fround(start + span);
                    const radius = corner % 2 ? 20.1875 : 12.25;
                    const error = Math.hypot(data.getFloat32(index*40,true) - (32+radius*Math.cos(angle)),data.getFloat32(index*40+4,true) - (32+radius*Math.sin(angle)));
                    active.maxPositionError = Math.max(active.maxPositionError,error);
                    if (error > 0.002) throw new Error(`Arc source order/index wrap at ${active.sourceIndices}: ${error}`);
                    active.sourceIndices++;
                }
            }
            active.draws.push({mode,count,vertexCount,maxIndex,indexBytes:indices.byteLength,vertexBytes:vertices.byteLength});
            return original.call(this,mode,count,type,offset,instances);
        };
    }
    restore = () => { for (const [method, original] of originals) gl[method] = original; };
}
function end(name) {
    if (!active || active.name !== name) throw new Error("Mismatched capacity phase");
    restore();
    const pixels = new Uint8Array(64 * 64 * 4);
    gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    active.boundaryPixels = 0;
    for (let y=0; y<64; y++) for (let x=0; x<64; x++) {
        const covered = name === "lines" ? y === 32 && x < 48 : y < 16 && x < (name === "index-count" ? 16 : 48);
        let expected = covered ? x < 16 ? [255,0,0,255] : x < 32 ? [0,255,0,255] : [0,0,255,255] : [0,0,0,255];
        if (name.startsWith("policy-arc-")) {
            const radius = Math.hypot(x+0.5-32,y+0.5-32);
            const color = name === "policy-arc-default" ? [255,0,0,255] : [0,255,0,255];
            expected = radius > 12.25 && radius < 20.1875 ? color : [0,0,0,255];
            // Exact-binary radii put this 64px grid at least 0.068px from either
            // boundary. Only the 0.005px analytic band permits either covered or
            // clear pixels; every unambiguous interior/exterior pixel is strict.
            if (Math.min(Math.abs(radius-12.25),Math.abs(radius-20.1875)) <= 0.005) {
                active.boundaryPixels++;
                const at = ((63-y)*64+x)*4;
                if (![color,[0,0,0,255]].some(rgba=>rgba.every((v,i)=>pixels[at+i]===v))) throw new Error("Unexpected arc boundary color");
                continue;
            }
        }
        if (name === "policy-setter") expected = x>=16&&x<48&&y>=16&&y<48 ? x<32?[255,0,0,255]:[0,255,0,255] : [0,0,0,255];
        const at = ((63-y)*64+x)*4;
        if (expected.some((v,i) => pixels[at+i] !== v)) throw new Error(`Pixel mismatch ${name} at ${x},${y}: ${pixels.slice(at,at+4)}`);
    }
    active.glError = gl.getError();
    if (active.glError !== gl.NO_ERROR) throw new Error(`GL error ${active.glError}`);
    active.completePixels = true;
    evidence.phases.push(active);
    active = null;
}
for (const level of ["log","info","warn","error"]) {
    const original = console[level];
    console[level] = (...args) => {
        const value = args.join(" ");
        evidence.messages.push(value);
        if (level === "error") {
            if (oldV1 && /^RuntimeError: unreachable(?: executed)?$/.test(value)) evidence.expectedStartupErrors.push(value);
            else evidence.errors.push(value);
        }
        original.apply(console,args);
        try {
            if (value.startsWith("CAPACITY_BEGIN ")) begin(value.split(" ")[1]);
            if (value.startsWith("POLICY_ARC ")) {
                active.arcDegrees = Number(value.split(" ")[1]);active.segments = Number(value.split(" ")[2]);
                active.sourceIndices = 0;active.maxPositionError = 0;
            }
            if (value.startsWith("CAPACITY_END ")) end(value.split(" ")[1]);
            if (value === "browser capacity regression: passed") evidence.completed = true;
        } catch (error) { evidence.errors.push(String(error)); }
    };
}
window.onerror = value => evidence.errors.push(String(value));
window.onunhandledrejection = event => evidence.errors.push(String(event.reason));
</script>
<script src="/js/mq_js_bundle.js"></script>
<script>
if (new URLSearchParams(location.search).get("selectionVersion") === "1") {
    // Labelled old-v1 contract: real Rust startup must reject before getContext.
    importObject.env.webgl_selection_version = () => 1;
}
load(new URLSearchParams(location.search).get("wasm"));
</script>
