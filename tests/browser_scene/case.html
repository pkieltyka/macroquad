    if ((match = /^SCENE_START (\d+) (camera|screen)$/.exec(value))) {
        if (activeTrial || !Number.isFinite(latestRaf)) throw new Error("Invalid trial start");
        activeTrial = { trial:Number(match[1]), variant:match[2], rafTimestampsMs:[latestRaf], visibility:[document.visibilityState] };
    }

        activeTrial.cpuSceneApiMs = JSON.parse(match[3]);
        activeTrial.rafIntervalsMs = activeTrial.rafTimestampsMs.slice(1).map((time,i) => time - activeTrial.rafTimestampsMs[i]);
        evidence.trials.push(activeTrial);

        }

} catch (error) { evidence.errors.push(String(error)); }
