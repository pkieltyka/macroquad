<script>
window.evidence = { messages: [], errors: [], staleBindings: 0, version: null, requestedMode: null, completed: false,
    requests: [], startupError: null, createdTextures: 0, liveTextures: 0, createdFramebuffers: 0, liveFramebuffers: 0 };
const parameters = new URLSearchParams(location.search);
const nativeGetContext = HTMLCanvasElement.prototype.getContext;
const observedContexts = new Set();
HTMLCanvasElement.prototype.getContext = function (name, ...args) {
    if (name !== "webgl" && name !== "webgl2") return nativeGetContext.call(this, name, ...args);
    evidence.requests.push(name);
    const blocked = parameters.get("block");
    if (blocked === "all" || (blocked === "webgl2" && name === "webgl2")) return null;
    const context = nativeGetContext.call(this, name, ...args);
    if (context && !observedContexts.has(context)) {
        observedContexts.add(context);
        for (const [kind, created, live] of [["Texture", "createdTextures", "liveTextures"], ["Framebuffer", "createdFramebuffers", "liveFramebuffers"]]) {
            const objects = new Set();
            const create = context[`create${kind}`].bind(context), remove = context[`delete${kind}`].bind(context);
            context[`create${kind}`] = (...values) => {
                const object = create(...values);
                if (object) { objects.add(object); evidence[created]++; evidence[live] = objects.size; }
                return object;
            };
            context[`delete${kind}`] = object => {
                if (object && !objects.delete(object)) evidence.errors.push(`Duplicate/unowned ${kind} deletion`);
                evidence[live] = objects.size;
                return remove(object);
            };
        }
    }
    return context;
};
for (const level of ["log", "info", "warn", "error"]) {
    const original = console[level];
    console[level] = (...args) => {
        const message = args.join(" ");
        evidence.messages.push(message);
        if (level === "error" && !message.includes("already deleted texture ID")) evidence.errors.push(message);
        if (message.includes("Texture cache regression passed:")) evidence.completed = true;
        original.apply(console, args);
    };
}
window.onerror = message => evidence.errors.push(String(message));
window.onunhandledrejection = event => evidence.errors.push(String(event.reason));
</script>
